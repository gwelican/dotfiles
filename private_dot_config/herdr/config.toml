onboarding = false
[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "#303446"
surface0 = "#414559"
surface1 = "#51576d"
overlay0 = "#737994"
overlay1 = "#838ba7"
text = "#c6d0f5"
subtext0 = "#a5adce"
mauve = "#ca9ee6"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
blue = "#8caaee"
teal = "#94d2f6"
peach = "#ef9f76"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
accent = "cyan"
# pane_borders = true
# pane_gaps = true
pane_borders = true
pane_gaps = true
copy_on_select = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[keys]
goto = "prefix+F"
prefix = "ctrl+a"
split_vertical = "prefix+|"
reload_config = "prefix+r"
last_pane = "ctrl+`"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
focus_pane_left = ["prefix+left"]
focus_pane_right = ["prefix+right"]
focus_pane_up = ["prefix+up"]
focus_pane_down = ["prefix+down"]
toggle_sidebar = ["ctrl+p"]
# Unbind built-in help; the keybind browser popup (below) replaces it.
help = ""


[session]
resume_agents_on_restore = true

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"
description = "Open lazygit in a new pane"

[[keys.command]]
key = "prefix+shift+b"            # toggle the docked beads sidebar
type = "plugin_action"
command = "herdr-beads.open-dock"

[[keys.command]]
key = "prefix+shift+k"             # toggle the floating beads board
type = "plugin_action"
command = "herdr-beads.open-board"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "open project workspace"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "open worktree workspace"

[[keys.command]]
key = "ctrl+space"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin cesarferreira.herdr-palette --entrypoint picker"
description = "Open Herdr Palette"

[[keys.command]]
key = "prefix+I"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "prefix+?"
type = "plugin_action"
command = "gwelican.keybinds.open"
description = "open keybind browser (replaces built-in help)"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore"

# named spaces (below)
[[keys.command]]
key = "prefix+S"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save-space"
description = "resurrect: save this space as…"

[[keys.command]]
key = "prefix+O"
type = "plugin_action"
command = "ntindle.herdr-resurrect.open-space"
description = "resurrect: open saved space…"

[worktrees]
directory = "~/.herdr/worktrees"
