permission_inheritance = "on"
minimal_overhead = true
structure_first = true
journal_enabled = true
auto_capture = true
proxy_enabled = true
allow_ide_config_dirs = false
shell_allowlist_extra = [
    "kubectl",
    "flux",
    "wrestool",
    "objdump",
    "strings",
    "python3",
    "xxd",
    "od",
    "file",
    "xargs",
    "awk",
    "sed",
    "cut",
    "tr",
    "sort",
    "uniq",
    "wc",
    "ls",
    "mkdir",
    "cp",
    "mv",
    "cat",
    "head",
    "tail",
    "grep",
    "find",
    "du",
    "df",
    "stat",
    "date",
    "lsusb",
    "journalctl",
    "dmesg",
    "xinput",
    "hwinfo",
    "lspci",
    "readlink",
    "ps",
    "pgrep",
    "fwupdmgr",
    "rpm-ostree",
    "modinfo",
    "lsmod",
    "systemctl",
    "podman",
    "mise",
]

[setup]
auto_inject_rules = true
auto_inject_skills = true

[updates]
auto_update = false
check_interval_hours = 6
notify_only = false

[archive]
enabled = true
